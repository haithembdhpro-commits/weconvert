:root{

 --wc-brand:#f97316;--wc-action:#b84308;--wc-action-hover:#963506;
 --wc-brand-soft:#fff0e6;--wc-focus:#1558b5;--wc-dot-muted:#e5e7eb;
 --bg:var(--wc-canvas);--surface:var(--wc-surface);--side:var(--wc-sidebar);
 --text:var(--wc-ink);--muted:var(--wc-muted);--line:var(--wc-line);
 --control:var(--wc-control);--soft:#f2f3f5;--orange:var(--wc-action);
 --brand:var(--wc-brand);--primary:var(--wc-action);--orange-soft:var(--wc-brand-soft);
 --green:#137c45;--blue:#1558b5;--purple:#783ab4;--red:#b42318;
 --tone-orange:#a83e00;--tone-blue:#1558b5;--tone-green:#137c45;
 --tone-purple:#783ab4;--tone-red:#b42318;--tone-gray:#59616c;
 --radius:.875rem;--sidebar-width:17rem;--target:2.75rem;
 --shadow:0 2px 8px #11182708;
}
html{color-scheme:light}
body{font-family:'Outfit','Noto Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--text);letter-spacing:0}
button,input,select,textarea{font-family:inherit}
[lang=ar]{font-family:'Noto Sans Arabic','Outfit',system-ui,sans-serif;letter-spacing:normal}
h1{font-size:clamp(1.75rem,2.2vw,2.25rem);font-weight:600;line-height:1.22;letter-spacing:-.025em}
h2{font-size:1.375rem;font-weight:600;line-height:1.3;letter-spacing:-.015em}
h3{font-weight:600}
.sidebar{background:var(--side);border-right:1px solid var(--line)}
.brand{padding:1.75rem 1.5rem 1.25rem;gap:.75rem}
.brand-name{font-size:1.55rem;font-weight:600;letter-spacing:-.04em}
.brand-sub{font-size:.75rem;font-weight:500;letter-spacing:.08em;margin-top:.3rem}
.brandmark{color:var(--brand);width:2.25rem;height:2.25rem}
.store-switch{background:#e9e9e9;border-color:#e2e2e2;border-radius:.75rem;margin:0 1rem 1.25rem;padding:.75rem;min-height:3.5rem}
.store-icon{background:var(--surface);color:var(--orange);border-radius:.5rem}
.store-name{font-weight:600}
.nav-section{color:var(--muted);font-size:.75rem;font-weight:600;letter-spacing:.075em;padding:1rem .75rem .375rem}
.nav-link{color:var(--text);font-weight:450;border-radius:.625rem;min-height:2.75rem;margin:.125rem 0}
.nav-link svg{width:1.25rem;height:1.25rem;stroke-width:1.75}
.nav-link:hover{background:#e9e9e9}
.nav-link.active{background:var(--orange-soft);color:var(--orange);font-weight:600}
.nav-link .counter{background:#e9e9e9;border-radius:999px;min-width:1.65rem;padding:.1rem .4rem}
.profile{background:var(--surface);border-color:var(--line);border-radius:.75rem;box-shadow:var(--shadow);margin:1rem}
.topbar{background:var(--bg);border-bottom:0;min-height:5.5rem;padding:1rem 2rem}
.breadcrumbs{color:var(--muted);font-size:.875rem}
.breadcrumbs b{font-weight:600;color:var(--text)}
.top-actions{gap:.625rem}
.demo-tag{background:#eaf7ef;color:#145b39;border:1px solid #d1e9dc;font-weight:500}
.search-trigger,.icon-btn{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.search-trigger{color:var(--muted);min-height:var(--target)}
.icon-btn{width:var(--target);height:var(--target);border-radius:.625rem}
.icon-btn.bare:not(.mobile-menu){border:1px solid var(--line)}
#content{max-width:100rem;padding:1rem 2rem 2.5rem}
.page-head{align-items:flex-end;gap:1rem;margin-bottom:1.75rem}
.page-head p{color:var(--muted);margin-top:.375rem}
.head-actions{align-items:center}
.btn,.btn.sm,.head-actions .btn{border-radius:.625rem;min-height:var(--target);font-weight:500}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 3px 8px #b843081a}
.btn.primary:hover{background:var(--wc-action-hover);border-color:var(--wc-action-hover)}
.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
.card-head{padding:1.5rem 1.5rem 1rem;align-items:center}

.pad{padding:1.5rem}
.kpis{grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin-bottom:1rem}
.kpis.kpis-four{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:1.5rem;min-height:12.5rem;gap:0;justify-content:space-between;transition:border-color .15s,box-shadow .15s,transform .15s}
.kpi:hover{border-color:#c8ccd2;box-shadow:0 8px 20px #1118270e;transform:translateY(-1px)}
.kpi-top{display:flex;align-items:center;font-size:1.0625rem;font-weight:500;gap:.75rem}
.kpi-top>.icon{width:2.5rem;height:2.5rem;border-radius:.6rem;background:var(--tint);color:var(--tone)}
.kpi-top>.icon svg{width:1.25rem;height:1.25rem}
.kpi-top>.arrow{margin-left:auto;color:var(--text);width:1.125rem;height:1.125rem}
.wc-kpi-bottom{display:flex;align-items:end;justify-content:space-between;gap:.5rem;min-width:0;width:100%;margin-top:1rem}
.wc-kpi-copy{display:flex;flex-direction:column;align-items:flex-start;gap:.25rem;min-width:0}
.kpi-value{font-size:clamp(2.125rem,3vw,3rem);font-weight:600;line-height:1.05;letter-spacing:-.04em;margin:0;white-space:normal;overflow-wrap:anywhere}
.kpi-foot{font-size:.875rem;line-height:1.45;color:var(--muted);text-align:left}
.kpi-foot b{color:var(--tone);font-weight:600}
.wc-kpi-spark{width:7rem;height:4rem;flex:0 0 7rem;align-self:end;display:block}
.wc-kpi-spark .on{fill:var(--tone)}
.wc-kpi-spark .off{fill:var(--wc-dot-muted)}
.overview-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(19rem,1fr);gap:1rem;margin-bottom:1rem;align-items:stretch}
.overview-row>.card{min-height:27rem}
.chart-card{display:flex;flex-direction:column}
.chart-card .card-head{padding-bottom:.5rem}
.chart-meta{padding:1rem 1.5rem 0}
.chart-total{font-size:2.625rem;font-weight:600;line-height:1.1;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.chart-meta p{margin-top:.375rem}
.pill{border-radius:.5rem;padding:.375rem .625rem;background:var(--soft);color:var(--text)}
.crm-chart.wc-dots-chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.5rem;align-items:end;height:auto;min-height:15rem;padding:1.5rem 1.5rem 1.25rem;margin-top:auto}
.wc-dots-day{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0;gap:.5rem}
.wc-dots-day b{font-size:.875rem;font-weight:600;font-variant-numeric:tabular-nums}
.wc-dots-day small{font-size:.75rem;color:var(--muted);white-space:nowrap}

.wc-activity-card{margin-bottom:1.5rem}
.wc-activity-card .card-head{padding-bottom:1.25rem}
.toolbar{padding:1.125rem 1.5rem}
.tabs{margin-bottom:1.5rem}
.tabs button.active{font-weight:600}
.searchbox{border-color:var(--control);border-radius:.625rem}
.table-scroll{background:var(--surface)}
table{font-size:.9375rem}

td{font-size:.9375rem;min-height:3.75rem;padding:1rem;vertical-align:middle}
tbody tr{height:3.75rem}
.order-id{font-size:.9375rem}
.badge{font-weight:500}
.pagination button{width:var(--target);height:var(--target);display:inline-grid;place-items:center;border-radius:.5rem}
.pagination button svg{width:1rem;height:1rem}
.pagination button[aria-label="Page précédente"] svg{transform:rotate(180deg)}
.product-thumb,.task-icon,.integration-logo{border-radius:.625rem}
.panel-columns{grid-template-columns:minmax(17rem,21rem) minmax(0,1fr);gap:1rem}
.queue-item{border-radius:.625rem}
.field input,.field select,.field textarea,.input,.order-line input,.order-line select{border-color:var(--control)}
.form-grid[hidden]{display:none}
.modal{border-radius:var(--radius)}
.modal.wide{width:45rem}
.modal.drawer{border-radius:var(--radius) 0 0 var(--radius)}
:is(button,a,input,select,textarea,[tabindex]):focus-visible,.searchbox:focus-within{outline:3px solid var(--wc-focus);outline-offset:2px}
.mono,.kpi-value,.chart-total,td .mono{font-variant-numeric:tabular-nums}

/* Performance reports reuse the CRM cards, filters, progress tracks and tables. */

.report-chart-scroll{overflow-x:auto;padding:1.5rem 1.5rem 0;margin-top:auto;scrollbar-width:thin}
.report-chart{display:grid;grid-template-columns:repeat(var(--report-columns),minmax(1.5rem,1fr));gap:.35rem;min-width:max(100%,calc(var(--report-columns) * 2.15rem));align-items:end}

.report-status-list{margin-top:1rem}

.report-breakdowns .card{min-width:0}
.report-breakdowns .table-scroll{max-width:100%;overflow-x:auto}
.report-breakdowns td{overflow-wrap:anywhere}

.report-sku{display:block}
.report-table-note{padding:0 1.5rem 1.25rem}
