function miniDots(color,seed=0){let dots='';for(let x=0;x<15;x++){let n=2+((x*7+seed*3)%8)+Math.floor(x/5);for(let y=0;y<n;y++)dots+=`<circle cx="${x*6+3}" cy="${54-y*4.5}" r="1.65" fill="${PALETTE[color][0]}" opacity="${.5+y*.06}"/>`}return `<svg class="mini-dots" viewBox="0 0 91 60" aria-hidden="true">${dots}</svg>`}
function kpi(label,val,ic,color,foot,nav='',unit='',idx=0){return `<button class="card kpi ${String(val).length>6?'wide-number':''}" ${nav?`data-nav="${nav}"`:'data-action="definitions"'} style="${tone(color)}"><div class="kpi-top"><span class="icon">${icon(ic)}</span><span>${label}</span>${icon('arrow','arrow')}</div><div class="kpi-value">${val}${unit?`<span class="unit">${unit}</span>`:''}</div><div class="kpi-foot">${foot}</div>${miniDots(color,idx)}</button>`}
function chart(os=scoped(),mode=chartMode){
 const days=Array.from({length:period==='today'?1:7},(_,i)=>22-(period==='today'?0:6)+i);
 const vals=days.map(d=>{const s=os.filter(o=>+o.created.slice(8,10)===d);return mode==='revenue'?sum(s.filter(o=>o.status==='delivered'),total):s.length});
 const max=Math.max(1,...vals)*1.18;
 const title=mode==='revenue'?'Chiffre d’affaires livré':'Nombre de commandes';
 const summary=days.map((d,i)=>`${d} octobre : ${mode==='revenue'?money(vals[i]):vals[i]+' commandes'}`).join(' ; ');
 const scale=Array.from({length:4},(_,i)=>`<span>${mode==='revenue'?Math.round(max*(3-i)/3/1000)+'k':Math.round(max*(3-i)/3)}</span>`).join('');
 const columns=days.map((d,i)=>{
  const n=Math.max(0,Math.round(vals[i]/max*18));let dots='';
  for(let col=0;col<5;col++)for(let j=0;j<19;j++)dots+=`<circle cx="${3+col*7}" cy="${137-j*7}" r="2.1" fill="${j<n?'var(--brand)':'var(--line)'}"/>`;
  return `<div class="chart-column"><svg viewBox="0 0 34 142" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><title>${esc(days[i]+' octobre : '+(mode==='revenue'?money(vals[i]):vals[i]+' commandes'))}</title>${dots}</svg><span class="chart-day"><span class="chart-long">${d} oct.</span><span class="chart-short">${d}</span></span></div>`;
 }).join('');
 return `<figure class="sales-chart" role="img" aria-label="${esc(title+'. '+summary)}"><div class="chart-grid"><div class="chart-scale" aria-hidden="true">${scale}</div><div class="chart-columns" style="--days:${days.length}" aria-hidden="true">${columns}</div></div><figcaption class="chart-caption">Octobre 2026 · ${mode==='revenue'?'Montants en DA':'Nombre de commandes'}</figcaption></figure>`;
}
const periodButton=()=>btn(({all:'Toute la période',today:'22 octobre 2026',week:'16 – 22 oct. 2026',month:'1 – 22 oct. 2026'})[period],'period','calendar');
function dashboardPage(){const m=metrics(),newn=m.os.filter(o=>PRE.includes(o.status)).length,ready=m.os.filter(o=>o.status==='confirmed').length,ret=m.os.filter(o=>(o.status==='returned'&&!o.restocked)||o.status==='returning').length;const tasks=[['phone','orange',newn,'commandes à confirmer','En attente d’un appel client','confirmation'],['truck','blue',ready,'colis à expédier','Préparez votre prochain enlèvement','shipping'],['return','red',ret,'retours à traiter','Récupération et remise en stock','returns']];return header('Votre business, en un coup d’œil.','Chaque commande compte. Gardez une longueur d’avance.',periodButton()+btn('Nouvelle commande','newOrder','plus','primary'))+`<div class="kpis">${kpi('Commandes',f(m.os.length),'bag','purple','<b>'+m.os.filter(o=>o.created.startsWith(TODAY)).length+'</b> reçues le 22 octobre','orders','',1)}${kpi('Chiffre d’affaires livré',f(m.sales),'coins','orange',m.delivered.length+' commandes livrées','finance','DA',2)}${kpi('Taux de confirmation',pct(m.confirmed.length,m.os.length),'phone','blue','<b>'+m.confirmed.length+'</b> / '+m.os.length+' commandes','confirmation','',4)}${kpi('Taux de livraison',pct(m.delivered.length,m.confirmed.length),'truck','green','<b>'+m.delivered.length+'</b> / '+m.confirmed.length+' confirmées','shipping','',3)}</div><div class="overview-row"><section class="card chart-card"><div class="card-head"><h2>Performance des ventes</h2><div class="seg"><button data-chart="revenue" aria-pressed="${chartMode==='revenue'}" class="${chartMode==='revenue'?'on':''}">CA livré</button><button data-chart="orders" aria-pressed="${chartMode==='orders'}" class="${chartMode==='orders'?'on':''}">Commandes</button></div></div><div class="between chart-meta"><div><div class="chart-total">${chartMode==='revenue'?money(m.sales):f(m.os.length)}</div><p>Total sur la période sélectionnée</p></div><div class="chart-legend"><span><i class="legend-dot" style="background:var(--orange)"></i>${chartMode==='revenue'?'Ventes livrées':'Commandes créées'}</span><span>7 derniers jours</span></div></div>${chart(m.os)}</section><section class="card"><div class="card-head"><h2>Votre journée</h2><span class="pill">À traiter</span></div><div class="task-list">${tasks.map(([ic,c,n,t,sub,nav])=>`<button class="task" data-nav="${nav}" style="${tone(c)}"><span class="task-icon">${icon(ic)}</span><span class="grow"><span class="task-title">${n} ${t}</span><span class="task-sub" style="display:block">${sub}</span></span><span class="task-count">${n}</span>${icon('chevron')}</button>`).join('')}</div><div class="insight">${icon('bolt')}<span>${db.products.filter(p=>p.stock<=p.min).length} produits sous le seuil de stock. Anticipez votre réapprovisionnement.</span></div></section></div><section class="card funnel"><div class="card-head"><h2>Le parcours de vos commandes <small class="muted" style="font-weight:400;margin-left:7px">Volumes cumulés · même cohorte</small></h2>${btn('Analyser','goPerformance','arrow','link')}</div><div class="funnel-stages">${[['Reçues',m.os.length,'bag','purple','orders'],['Confirmées',m.confirmed.length,'phone','orange','orders/confirmed'],['Expédiées',m.shipped.length,'truck','blue','shipping/tracking'],['Livrées',m.delivered.length,'checkcircle','green','orders/completed'],['Retournées',m.returned.length,'return','red','returns']].map(([label,n,ic,c,nav])=>`<button class="stage" data-nav="${nav}" style="${tone(c)}">${icon(ic)}<span><span class="stage-label">${label}</span><span class="stage-number" style="display:block">${f(n)}</span></span><small>${pct(n,m.os.length)}</small></button>`).join('')}</div></section><section class="card"><div class="card-head"><div><h2>Dernières commandes</h2><p>Un aperçu de votre activité récente</p></div>${btn('Tout voir','goOrders','arrow','link')}</div>${ordersTable([...m.os].sort((a,b)=>b.created.localeCompare(a.created)).slice(0,5),true)}</section><div class="grid3 mt"><section class="card pad"><div class="between"><h2>Produits les plus vendus</h2>${icon('box')}</div>${db.products.map(p=>({p,n:sum(m.delivered,o=>sum(o.items,i=>i.pid===p.id?i.qty:0))})).sort((a,b)=>b.n-a.n).slice(0,3).map(({p,n})=>`<div class="progress-row"><div class="between"><span>${esc(p.name)}</span><b>${n}</b></div><div class="bar-track" style="${tone(p.color)}"><i style="width:${Math.min(100,n/Math.max(1,m.delivered.length)*180)}%"></i></div></div>`).join('')}</section><section class="card pad"><div class="between"><h2>Top wilayas</h2>${icon('globe')}</div>${groupStats('wilaya',m.os).slice(0,3).map(g=>`<div class="progress-row"><div class="between"><span>${esc(g.name)}</span><b>${money(g.sales)}</b></div><div class="bar-track"><i style="width:${g.total/Math.max(1,m.os.length)*500}%"></i></div></div>`).join('')}</section><section class="card pad"><div class="between"><h2>Votre équipe</h2>${btn('Voir','goTeam','arrow','link')}</div>${db.agents.slice(0,3).map(a=>`<div class="progress-row between"><div class="flex"><span class="avatar ${a.id==='a2'?'violet':'blue'}">${initials(a.full)}</span><span>${esc(a.full)}<small class="muted" style="display:block">${esc(a.role)}</small></span></div>${badge(a.available?'Disponible':'Hors ligne',a.available?'green':'gray')}</div>`).join('')}</section></div>`}
function reserved(pid){return sum(activeOrders().filter(o=>o.status==='confirmed'),o=>sum(o.items,i=>i.pid===pid?i.qty:0))}
function orderMatch(o){const query=q.toLocaleLowerCase();return (!q||[o.id,o.name,o.phone,o.wilaya,o.carrier,...o.items.map(i=>product(i.pid)?.name)].join(' ').toLocaleLowerCase().includes(query))&&Object.entries(filter).every(([k,v])=>!v||String(o[k])===v)}
function orderSet(){let list=activeOrders();const groups={new:['new'],processing:PRE.filter(s=>s!=='new'),confirmed:['confirmed'],shipping:OUT,completed:DONE,cancelled:CANCEL};if(groups[tab])list=list.filter(o=>groups[tab].includes(o.status));return list.filter(orderMatch).sort((a,b)=>sortAsc?a.created.localeCompare(b.created):b.created.localeCompare(a.created))}
function ordersTable(os,compact=false){return `<div class="table-scroll" role="region" aria-label="Tableau de données, défilement horizontal si nécessaire" tabindex="0"><table><thead><tr>${!compact?`<th><input type="checkbox" class="check" data-select-page aria-label="Sélectionner cette page" ${os.length&&os.every(o=>selected.has(o.id))?'checked':''}></th>`:''}<th>N° commande</th><th>Client</th><th>Produit</th><th>Wilaya</th><th>Montant COD</th><th>${compact?'Transporteur':'Agent / transporteur'}</th><th>Statut</th><th>${compact?'Date':`<button data-action="sortOrders">Date ${icon('down')}</button>`}</th><th></th></tr></thead><tbody>${os.map((o,idx)=>{let p=product(o.items[0]?.pid);return `<tr class="clickrow" data-open-order="${esc(o.id)}">${!compact?`<td><input type="checkbox" class="check" data-select-order="${o.id}" aria-label="Sélectionner ${o.id}" ${selected.has(o.id)?'checked':''}></td>`:''}<td><span class="order-id">#${esc(o.id)}</span><small class="muted" style="display:block;font-size:0.875rem">${esc(o.channel)}</small></td><td><div class="customer-cell"><span class="avatar ${['orange','blue','violet','green'][idx%4]}">${initials(o.name)}</span><span>${esc(o.name)}${!compact?`<small>${esc(o.phone)}</small>`:''}</span></div></td><td><div class="product-cell"><span class="product-thumb" style="${tone(p?.color||'purple')}">${icon(p?.icon||'box')}</span><span>${esc(p?.name||'Produit')}${o.items.length>1?` <small>+ ${o.items.length-1} autre(s) article(s)</small>`:`<small>${o.items[0]?.qty||0} article(s)</small>`}</span></div></td><td>${esc(o.wilaya)}</td><td class="mono"><b>${money(total(o))}</b></td><td>${esc(compact?o.carrier||'À attribuer':o.agent||'Non attribué')}${!compact?`<small class="muted" style="display:block;font-size:0.875rem">${esc(o.carrier||'À attribuer')}</small>`:''}</td><td>${statusBadge(o.status)}${o.status==='delivered'&&o.cashed?'<small class="muted" style="display:block;font-size:0.875rem;margin-top:3px">Encaissée</small>':''}</td><td class="muted">${dateStr(o.created)}</td><td>${icon('chevron')}</td></tr>`}).join('')}</tbody></table></div>${!os.length?empty():''}`}
function pager(n){let pages=Math.max(1,Math.ceil(n/12));page=Math.min(page,pages);return `<div class="table-foot"><span>${f(n)} résultat${n>1?'s':''} · ${n?((page-1)*12+1):0}–${Math.min(page*12,n)}</span><div class="pagination"><button data-page="${page-1}" ${page===1?'disabled':''} aria-label="Page précédente">‹</button>${Array.from({length:pages},(_,i)=>i+1).filter(n=>n===1||n===pages||Math.abs(n-page)<=1).map(n=>`<button data-page="${n}" class="${n===page?'selected':''}">${n}</button>`).join('')}<button data-page="${page+1}" ${page===pages?'disabled':''} aria-label="Page suivante">›</button></div></div>`}
function listTools(extra=''){return `<div class="toolbar"><label class="searchbox">${icon('search')}<input type="search" data-search value="${esc(q)}" placeholder="Rechercher un nom, n° de commande…" aria-label="Rechercher"></label><div class="flex">${Object.values(filter).some(Boolean)?'<span class="active-filter">Filtres actifs</span>':''}${btn('Filtres','filters','filter')}${btn('Exporter','exportOrders','download')}${extra}</div></div>`}
function pagedOrders(os){const n=os.length;page=Math.min(page,Math.max(1,Math.ceil(n/12)));return `${selected.size?`<div class="bulkbar"><b>${selected.size} sélectionnée(s)</b>${btn('Affecter un agent','bulkAssign','users','sm')}${btn('Confirmer','bulkConfirm','check','sm')}${btn('Expédier (démo)','bulkShip','truck','sm')}${btn('Étiquettes','bulkPrint','print','sm')}${btn('Corbeille','bulkDelete','trash','sm')}</div>`:''}${ordersTable(os.slice((page-1)*12,page*12))}${pager(n)}`}
function ordersPage(){const a=activeOrders(),t=tab||'all';return header('Commandes','De la première commande au dernier kilomètre.',btn('Importer','importOrders','upload')+btn('Nouvelle commande','newOrder','plus','primary'))+tabs([['all','Toutes',a.length],['new','Nouvelles',a.filter(o=>o.status==='new').length],['processing','En cours',a.filter(o=>PRE.includes(o.status)&&o.status!=='new').length],['confirmed','Confirmées',a.filter(o=>o.status==='confirmed').length],['shipping','Suivi',a.filter(o=>OUT.includes(o.status)).length],['completed','Terminées',a.filter(o=>DONE.includes(o.status)).length],['cancelled','Annulées',a.filter(o=>CANCEL.includes(o.status)).length]],t)+`<section class="card">${listTools()}${pagedOrders(orderSet())}</section>`}
function itemSummary(o){return table(['Article','Qté','Prix','Sous-total'],o.items.map(i=>`<tr><td>${esc(product(i.pid)?.name)}${i.upsell?' '+badge('Upsell','purple'):''}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`))}
function allowed(o){if(PRE.includes(o.status))return ['call1','call2','confirmed','cancelled','fake','duplicate'].filter(s=>s!==o.status);if(o.status==='confirmed')return ['shipped','cancelled'];if(OUT.includes(o.status))return ['delivering','alert','returning','returned','delivered'].filter(s=>s!==o.status);if(CANCEL.includes(o.status))return ['new'];return []}
function moveStatus(id,to){const o=db.orders.find(x=>x.id===id);if(!o||!allowed(o).includes(to))return false;if(to==='confirmed'&&db.blocked.includes(o.phone)){toast('Client bloqué : retirez-le de la liste noire avant confirmation.','info');return false}if(to==='confirmed'){const missing=Object.entries(demands(o.items)).some(([pid,n])=>(product(pid)?.stock||0)-reserved(pid)<n);if(missing){toast('Stock disponible insuffisant. Réapprovisionnez avant confirmation.','info');return false}}
 if(to==='shipped'){if(!o.carrier){toast('Choisissez un transporteur dans la commande.','info');return false}if(Object.entries(demands(o.items)).some(([pid,n])=>(product(pid)?.stock||0)<n)){toast('Expédition impossible : stock insuffisant.','info');return false}o.items.forEach(i=>{product(i.pid).stock-=i.qty;db.movements.unshift({id:uid('mv'),pid:i.pid,qty:-i.qty,type:'Expédition',ref:o.id,date:now()})});o.shipped=now()}
 o.status=to;o.history.unshift({at:now(),text:'Statut : '+statusDefs[to][0]+(to==='shipped'?' · expédition simulée':'')});o.updated=now();audit(o.id+' → '+statusDefs[to][0]);save();return true}
function detailBody(o){return `<div class="between mb"><div class="flex">${statusBadge(o.status)}${o.cashed?badge('Encaissée','green'):''}</div><span class="muted" style="font-size:0.875rem">${dateStr(o.created)} · ${esc(o.channel)}</span></div><section class="card pad"><div class="flex mb"><span class="avatar blue">${initials(o.name)}</span><div><h3>${esc(o.name)}</h3><p style="font-size:0.875rem">${esc(o.phone)}</p></div>${db.blocked.includes(o.phone)?badge('Bloqué','red'):''}</div><dl class="detail-grid"><div><dt>Wilaya / commune</dt><dd>${esc(o.wilaya)} · ${esc(o.commune)}</dd></div><div><dt>Adresse</dt><dd>${esc(o.address)}</dd></div><div><dt>Livraison</dt><dd>${esc(o.deliveryType)} · ${esc(o.carrier||'À attribuer')}</dd></div><div><dt>Agent</dt><dd>${esc(o.agent||'Non attribué')}</dd></div><div><dt>Source d’acquisition</dt><dd>${esc(o.source)} · ${esc(db.campaigns.find(c=>c.id===o.campaign)?.name||'Direct')}</dd></div><div><dt>Dernière mise à jour</dt><dd>${dateStr(o.updated||o.created)}</dd></div></dl>${o.reportedTo?`<div class="notice mt">${icon('clock')}Rappel prévu : ${esc(o.reportedTo.replace('T',' '))}</div>`:''}</section><h3 class="form-section">Articles & montants</h3>${itemSummary(o)}<div class="total-line"><span>Frais facturés au client</span><span>${money(o.fee)}</span></div><div class="total-line"><span>Remise</span><span>− ${money(o.discount)}</span></div><div class="total-line grand"><span>À encaisser</span><span>${money(total(o))}</span></div><div class="flex wrap mt">${allowed(o).map(s=>`<button class="btn ${s==='confirmed'||s==='delivered'?'success':''}" data-status="${s}" data-id="${o.id}">${s==='shipped'?'Expédier · démo':statusDefs[s][0]}</button>`).join('')}${PRE.includes(o.status)?`<button class="btn" data-report="${o.id}">${icon('calendar')}Reporter</button>`:''}${o.status==='delivered'&&!o.cashed?`<button class="btn primary" data-cash="${o.id}">Enregistrer l’encaissement</button>`:''}${o.status==='returned'&&!o.restocked?`<button class= function clientsPage(){const t=tab||'directory',cs=customerList().filter(c=>(!q||[c.name,c.phone,c.wilaya].join(' ').toLowerCase().includes(q.toLowerCase()))&&(t!=='vip'||c.delivered.length>=3)&&(t!=='blacklist'||c.blocked));if(t==='loyalty')return header('Récompensez vos clients fidèles.','Des règles simples pour donner envie de commander à nouveau.')+tabs([['directory','Annuaire'],['vip','Clients fidèles'],['blacklist','Liste noire'],['loyalty','Fidélité']],t)+`<section class="card pad" style="max-width:760px"><form data-form="loyalty"><div class="setting-line"><span><b>Programme de fidélité</b><p>Calcul sur le montant produit des commandes livrées.</p></span><input name="active" type="checkbox" class="check" ${db.settings.loyalty?'checked':''}></div><div class="form-grid mt">${field('DA dépensés pour gagner 1 point','rate',db.settings.loyaltyRate,'number',true,'min="1"')}${field('Valeur d’un point en DA','value',db.settings.loyaltyValue,'number',true,'min="0"')}</div><div class="notice mt">${icon('info')}Les points sont affichés dans les fiches clients. La remise s’applique manuellement sur une commande.</div><button class="btn primary">Enregistrer les règles</button></form></section>`;return header('Une relation qui dure.','Historique, fidélité et qualité de votre base clients.',btn('Exporter','exportClients','download')+btn('Nouveau client','newClient','plus','primary'))+tabs([['directory','Annuaire',customerList().length],['vip','Clients fidèles'],['blacklist','Liste noire',db.blocked.length],['loyalty','Fidélité']],t)+`<section class="card"><div class="toolbar"><label class="searchbox">${icon('search')}<input data-search type="search" value="${esc(q)}" placeholder="Nom, téléphone, wilaya…"></label><span class="muted" style="font-size:0.875rem">Identité regroupée par téléphone</span></div>${table(['Client','Wilaya','Commandes','Livrées','CA livré','Statut','Action'],cs.map(c=>`<tr><td><button class="table-name-btn flex" data-client="${c.phone}"><span class="avatar violet">${initials(c.name)}</span><span>${esc(c.name)}<small class="muted" style="display:block">${esc(c.phone)}</small></span></button></td><td>${esc(c.wilaya)}</td><td>${c.orders.length}</td><td>${c.delivered.length}</td><td>${money(c.revenue)}</td><td>${c.blocked?badge('Bloqué','red'):c.delivered.length>=3?badge('Fidèle','purple'):badge('Standard','gray')}</td><td><button class="btn sm" data-client="${c.phone}">Voir la fiche</button></td></tr>`))}</section>`}
function clientDetail(phone){const c=customerList().find(x=>x.phone===phone);if(!c)return;const pts=db.settings.loyalty?Math.floor(sum(c.delivered,o=>total(o)-o.fee)/db.settings.loyaltyRate):0;modal(esc(c.name),`<div class="grid3 mb"><div class="stat-box"><p>Commandes</p><strong>${c.orders.length}</strong></div><div class="stat-box"><p>CA livré</p><strong style="font-size:1.125rem">${money(c.revenue)}</strong></div><div class="stat-box"><p>Points fidélité</p><strong>${pts}</strong></div></div><dl class="detail-grid"><div><dt>Téléphone</dt><dd>${esc(c.phone)}</dd></div><div><dt>Wilaya</dt><dd>${esc(c.wilaya)}</dd></div></dl><h3 class="form-section">Commandes du client</h3>${table(['Référence','Montant','Statut'],c.orders.map(o=>`<tr><td><button class="table-name-btn" data-open-order="${o.id}">#${o.id}</button></td><td>${money(total(o))}</td><td>${statusBadge(o.status)}</td></tr>`))}<h3 class="form-section">Notes client</h3><form data-form="clientNote" data-id="${phone}"><label class="field"><textarea name="note" placeholder="Préférences, précisions…">${esc(db.clientNotes[phone]||'')}</textarea></label><button type="submit" class="btn mt">Enregistrer</button></form>`,`<button class="btn ${c.blocked?'':'danger'}" data-block="${phone}">${icon('shield')}${c.blocked?'Débloquer le client':'Bloquer le client'}</button>`,'drawer')}
function genericForm(kind,id=''){const specs={supplier:{title:'Fournisseur',list:db.suppliers,fields:p=>field('Nom','name',p.name,'text',true)+field('Téléphone','phone',p.phone,'tel')+field('Ville','city',p.city)+field('Note','note',p.note)},warehouse:{title:'Entrepôt',list:db.warehouses,fields:p=>field('Nom','name',p.name,'text',true)+field('Ville','city',p.city,'text',true)+field('Adresse','address',p.address,'text',true)},client:{title:'Client',list:db.clients,fields:p=>field('Nom','name',p.name,'text',true)+field('Téléphone','phone',p.phone,'tel',true,'pattern="0[567][0-9]{8}"')+selectField('Wilaya','wilaya',WILAYAS,p.wilaya||'Alger')+field('Adresse','address',p.address)},agent:{title:'Membre de l’équipe',list:db.agents,fields:p=>field('Prénom','name',p.name,'text',true)+field('Nom affiché','full',p.full,'text',true)+field('Email de démonstration','email',p.email,'email',true)+selectField('Rôle','role',['Confirmation','Suivi','Confirmation & suivi','Administrateur','Marketer'],p.role)+field('Frais par commande livrée (DA)','fee',p.fee??30,'number',true,'min="0"')},wallet:{title:'Portefeuille',list:db.wallets,fields:p=>field('Nom','name',p.name,'text',true)+field('Solde initial (DA)','opening',p.opening??0,'number',true)},template:{title:'Modèle de message',list:db.templates,fields:p=>field('Nom','name',p.name,'text',true)+`<label class="field full"><span>Message</span><textarea name="text" required>${esc(p.text||'Bonjour {{nom}}, votre commande {{commande}} de {{total}}…')}</textarea><small>Variables : {{nom}}, {{commande}}, {{total}}</small></label>`},sourcing:{title:'Demande de sourcing',list:db.sourcing,fields:p=>field('Produit recherché','name',p.name,'text',true)+field('Quantité souhaitée','qty',p.qty??100,'number',true,'min="1"')+field('Budget unitaire (DA)','budget',p.budget??0,'number',true,'min="0"')+field('Note / cahier des charges','note',p.note)}};const spec=specs[kind],p=spec.list.find(x=>x.id===id)||{};modal((id?'Modifier : ':'Ajouter : ')+spec.title,`<form id="generic-form" data-form="generic" data-kind="${kind}" data-id="${id}"><div class="form-grid">${spec.fields(p)}</div>${kind==='agent'?'<p class="mt" style="font-size:0.875rem">Membre local de démonstration. Aucune invitation ne sera envoyée.</p>':''}</form>`,btn('Annuler','close')+`<button type="submit" form="generic-form" class="btn primary">Enregistrer</button>`)}
function purchasesPage(){const t=tab||'entries';let body='';if(t==='suppliers')body=`<section class="card">${table(['Fournisseur','Ville','Achats enregistrés','À payer','Action'],db.suppliers.map(s=>{let ps=db.purchases.filter(p=>p.supplier===s.id);return `<tr><td><b>${esc(s.name)}</b><small class="muted" style="display:block">${esc(s.phone||'Coordonnées à compléter')}</small></td><td>${esc(s.city)}</td><td>${money(sum(ps,p=>p.qty*p.cost))}</td><td>${money(sum(ps.filter(p=>!p.paid),p=>p.qty*p.cost))}</td><td><button class="btn sm" data-edit-supplier="${s.id}">Modifier</button></td></tr>`}))}</section>`;else if(t==='sourcing')body=`<div class="grid3">${db.sourcing.map(s=>`<section class="card pad"><div class="between mb">${badge(s.status||'À rechercher','orange')}${icon('box')}</div><h3>${esc(s.name)}</h3><p class="mt" style="font-size:1rem">${f(s.qty)} unités · Budget ${money(s.budget)} / unité</p><p style="font-size:0.875rem;margin:8px 0 15px">${esc(s.note)}</p><button class="btn sm" data-sourcing-next="${s.id}">Étape suivante</button></section>`).join('')}<button class="card pad" data-action="newSourcing" style="min-height:180px;border-style:dashed">${icon('plus')}Nouvelle demande</button></div>`;else body=`<section class="card"><div class="card-head"><h2>Entrées d’achat</h2><span class="pill">Réception → mise à jour du stock</span></div>${table(['Référence','Fournisseur','Produit','Quantité','Montant','État','Paiement','Action'],db.purchases.map(p=>`<tr><td>${esc(p.id)}</td><td>${esc(db.suppliers.find(s=>s.id===p.supplier)?.name)}</td><td>${esc(product(p.pid)?.name)}</td><td>${p.qty}</td><td>${money(p.qty*p.cost)}</td><td>${badge(p.received?'Réceptionnée':'En attente',p.received?'green':'orange')}</td><td>${badge(p.paid?'Payé':'À payer',p.paid?'green':'red')}</td><td><div class="flex">${!p.received?`<button class="btn sm" data-receive-purchase="${p.id}">Réceptionner</button>`:''}${!p.paid?`<button class="btn sm" data-pay-purchase="${p.id}">Régler</button>`:''}</div></td></tr>`))}</section>`;return header('Un stock prêt pour vos ventes.','Fournisseurs, approvisionnement et réception des marchandises.',t==='suppliers'?btn('Nouveau fournisseur','newSupplier','plus','primary'):t==='sourcing'?btn('Nouvelle demande','newSourcing','plus','primary'):btn('Nouvelle entrée','newPurchase','plus','primary'))+tabs([['entries','Entrées d’achat',db.purchases.length],['suppliers','Fournisseurs',db.suppliers.length],['sourcing','Sourcing']],t)+body}

function financePage(){const t=tab||'overview',m=metrics(activeOrders()),awaiting=m.delivered.filter(o=>!o.cashed),totalCash=sum(db.wallets,w=>balance(w.id));let body='';if(t==='overview')body=`<div class="kpis">${kpi('Bénéfice net estimé',f(m.profit),'chart','green','Après coûts, publicité et charges','performance','DA',3)}${kpi('Soldes des portefeuilles',f(totalCash),'wallet','blue','Soldes initiaux + mouvements','finance/wallets','DA',2)}${kpi('À recevoir · transporteurs',f(sum(awaiting,o=>total(o)-o.costFee)),'truck','orange',awaiting.length+' commandes à rapprocher','finance/reconciliation','DA',1)}${kpi('Marge nette',pct(m.profit,m.sales),'target','purple','Bénéfice / chiffre d’affaires livré','performance','',4)}</div><div class="grid2"><section class="card pad"><h2 class="mb">Du chiffre d’affaires au bénéfice</h2>${[['CA livré, frais client inclus',m.sales],['Coûts transporteurs',-m.delivery],['Frais de retour',-m.returns],['Coût des produits livrés',-m.goods],['Publicité · dépenses de démonstration',-m.adSpend],['Charges opérationnelles',-m.charges],['Commissions agents',-m.agents]].map(([l,n])=>`<div class="total-line"><span class="muted">${l}</span><b class="${n<0?'':'positive'}">${money(n)}</b></div>`).join('')}<div class="total-line grand"><span>Bénéfice net estimé</span><span class="${m.profit>=0?'positive':'negative'}">${money(m.profit)}</span></div><p style="font-size:0.875rem;margin-top:13px">Périmètre : toutes les commandes actives et toutes les charges de la démo. Les achats de stock ne sont pas déduits deux fois.</p></section><section class="card pad"><h2 class="mb">Portefeuilles</h2>${db.wallets.map(w=>`<div class="progress-row between"><div class="flex"><span class="task-icon" style="${tone('blue')}">${icon('wallet')}</span><span>${esc(w.name)}<small class="muted" style="display:block">Solde initial : ${money(w.opening)}</small></span></div><b>${money(balance(w.id))}</b></div>`).join('')}<div class="notice mt">${icon('info')}Bénéfice et trésorerie sont distincts. Les soldes augmentent seulement lors de l’enregistrement d’un encaissement.</div>${btn('Enregistrer un mouvement','newTransaction','plus','primary')}</section></div>`;else if(t==='wallets')body=`<div class="grid3">${db.wallets.map(w=>`<section class="card pad"><span class="task-icon mb" style="${tone('blue')}">${icon('wallet')}</span><h2>${esc(w.name)}</h2><div class="chart-total mt">${money(balance(w.id))}</div><div class="between mt"><span class="positive">+ ${money(sum(db.transactions.filter(t=>t.wallet===w.id&&t.kind==='in'),t=>t.amount))}</span><span class="negative">− ${money(sum(db.transactions.filter(t=>t.wallet===w.id&&t.kind==='out'),t=>t.amount))}</span></div><p class="mt" style="font-size:0.875rem">Solde initial : ${money(w.opening)}</p></section>`).join('')}<button class="card pad" data-action="newWallet" style="border-style:dashed">${icon('plus')} Ajouter un portefeuille</button></div><div class="mt">${btn('Transférer entre portefeuilles','walletTransfer','refresh')}</div>`;else if(t==='reconciliation')body=`<div class="notice">${icon('info')}Rapprochement manuel : sélectionnez une commande livrée et confirmez le montant net effectivement reçu. Chaque commande ne peut être encaissée qu’une fois.</div><section class="card">${table(['Commande','Client','Transporteur','Montant COD','Frais transporteur','Net attendu','Action'],awaiting.map(o=>`<tr><td><button class="table-name-btn" data-open-order="${o.id}">#${o.id}</button></td><td>${esc(o.name)}</td><td>${esc(o.carrier)}</td><td>${money(total(o))}</td><td>${money(o.costFee)}</td><td><b>${money(total(o)-o.costFee)}</b></td><td><button class="btn sm" data-cash="${o.id}">Rapprocher</button></td></tr>`))}</section>`;else if(t==='charges')body=`<section class="card">${table(['Charge','Catégorie','Montant','Périodicité','Date','Action'],db.charges.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.category)}</td><td>${money(c.amount)}</td><td>${c.recurring?badge('Mensuelle','purple'):badge('Ponctuelle','gray')}</td><td>${dateStr(c.date)}</td><td><button class="btn sm" data-edit-charge="${c.id}">Modifier</button></td></tr>`))}</section>`;else {let trs=db.transactions.filter(x=>t==='transactions'||t==='payments'&&x.kind==='in'||t==='payouts'&&x.kind==='out');body=`<section class="card">${table(['Référence','Date','Portefeuille','Type','Bénéficiaire / origine','Montant'],trs.map(x=>`<tr><td>${esc(x.id)}</td><td>${dateStr(x.date)}</td><td>${esc(db.wallets.find(w=>w.id===x.wallet)?.name)}</td><td>${esc(x.category)}</td><td>${esc(x.partner||x.note||'—')}</td><td class="${x.kind==='in'?'positive':'negative'}"><b>${x.kind==='in'?'+':'−'} ${money(x.amount)}</b></td></tr>`))}</section>`}return header('La vraie santé de votre business.','Rentabilité, trésorerie et encaissements COD.',btn('Exporter','exportFinance','download')+btn(t==='charges'?'Nouvelle charge':'Nouveau mouvement',t==='charges'?'newCharge':'newTransaction','plus','primary'))+tabs([['overview','Vue financière'],['wallets','Portefeuilles'],['payments','Encaissements'],['payouts','Versements'],['charges','Charges'],['reconciliation','Rapprochement',awaiting.length]],t)+body}
function transactionForm(kind='in',orderId='',purchaseId=''){let o=db.orders.find(o=>o.id===orderId),p=db.purchases.find(p=>p.id===purchaseId),amount=o?total(o)-o.costFee:p?p.cost*p.qty:0;modal(o?'Rapprocher #'+o.id:p?'Régler le fournisseur':'Enregistrer un mouvement',`<form id="transaction-form" data-form="transaction" data-order="${orderId}" data-purchase="${purchaseId}"><div class="form-grid">${selectField('Type','kind',o?[['in','Encaissement transporteur']]:p?[['out','Versement fournisseur']]:[['in','Encaissement'],['out','Versement']],p?'out':kind)}${selectField('Portefeuille','wallet',db.wallets.map(w=>[w.id,w.name]))}${field('Montant (DA)','amount',amount,'number',true,'min="1" step="1"')}${field('Date','date',TODAY,'date',true)}${selectField('Catégorie','category',o?['Encaissement transporteur']:p?['Fournisseur']:['Encaissement transporteur','Fournisseur','Agent','Charge','Autre'])}${field('Partenaire / bénéficiaire','partner',o?.carrier||db.suppliers.find(s=>s.id===p?.supplier)?.name||'')}<label class="field full"><span>Note</span><textarea name="note"></textarea></label></div>${o?`<div class="notice mt">${icon('info')}Net attendu : ${money(amount)}. Le montant reçu doit correspondre. Traitez les écarts dans une charge distincte.</div>`:''}</form>`,btn('Annuler','close')+`<button type="submit" form="transaction-form" class="btn primary">Enregistrer</button>`)}
function chargeForm(id=''){let c=db.charges.find(c=>c.id===id)||{};modal('Charge opérationnelle',`<form id="charge-form" data-form="charge" data-id="${id}"><div class="form-grid">${field('Nom','name',c.name,'text',true)}${selectField('Catégorie','category',['Emballage','Entrepôt','IT','Ressources humaines','Divers'],c.category)}${field('Montant (DA)','amount',c.amount??0,'number',true,'min="1"')}${field('Date','date',c.date||TODAY,'date',true)}${selectField('Récurrence','recurring',[['false','Ponctuelle'],['true','Mensuelle']],String(!!c.recurring))}</div><p class="mt" style="font-size:0.875rem">Les dépenses publicitaires se renseignent dans Publicité & tracking. La récurrence est mémorisée ; aucun prélèvement automatique n’est exécuté.</p></form>`,btn('Annuler','close')+`<button type="submit" form="charge-form" class="btn primary">Enregistrer</button>`)}
function groupStats(key,os=activeOrders()){const groups=new Map();os.forEach(o=>{const names=key==='product'?o.items.map(i=>product(i.pid)?.name||'Produit'): [o[key]||'Non attribué'];[...new Set(names)].forEach(n=>{const g=groups.get(n)||{name:n,total:0,confirmed:0,delivered:0,returned:0,sales:0};g.total++;if(CONF.includes(o.status))g.confirmed++;if(o.status==='delivered'){g.delivered++;g.sales+=key==='product'?sum(o.items,i=>product(i.pid)?.name===n?i.price*i.qty:0):total(o)}if(o.status==='returned')g.returned++;groups.set(n,g)})});return [...groups.values()].sort((a,b)=>b.sales-a.sales)}
function performancePage(){const t=tab||'overview',m=metrics(activeOrders());let body='';if(t==='overview')body=`<div class="kpis">${kpi('Bénéfice net estimé',f(m.profit),'chart','green','CA − produits − frais − publicité − charges','finance','DA',1)}${kpi('Panier moyen livré',f(m.sales/Math.max(1,m.delivered.length)),'bag','blue',m.delivered.length+' commandes livrées','orders/completed','DA',2)}${kpi('Coût par commande livrée',f(m.adSpend/Math.max(1,m.delivered.length)),'target','orange','Dépense publicitaire / livrées','ads','DA',3)}${kpi('ROAS sur CA livré',(m.sales/Math.max(1,m.adSpend)).toFixed(2)+'×','bars','purple','CA livré / publicité · données démo','ads','',4)}</div><div class="grid2"><section class="card pad"><h2>Performance de confirmation</h2><div class="ring" style="--pct:${m.confirmed.length/(m.confirmed.length+m.os.filter(o=>CANCEL.includes(o.status)).length)*100}%"><span>${pct(m.confirmed.length,m.confirmed.length+m.os.filter(o=>CANCEL.includes(o.status)).length)}</span></div><p class="center" style="font-size:0.875rem">Confirmées / (confirmées + annulées)<br>Les commandes en attente sont exclues.</p></section><section class="card pad"><h2>Performance de livraison</h2><div class="ring" style="--pct:${m.delivered.length/Math.max(1,m.delivered.length+m.returned.length)*100}%"><span>${pct(m.delivered.length,m.delivered.length+m.returned.length)}</span></div><p class="center" style="font-size:0.875rem">Livrées / (livrées + retournées)<br>Les colis encore en transit sont exclus.</p></section></div><section class="card mt"><div class="card-head"><h2>Définitions des indicateurs</h2>${btn('Voir les formules','definitions','info','link')}</div>${table(['Indicateur','Formule','Valeur'],[['Taux de confirmation','Confirmées cumulées / total',pct(m.confirmed.length,m.os.length)],['Taux de livraison','Livrées / confirmées cumulées',pct(m.delivered.length,m.confirmed.length)],['Profit par commande livrée','Bénéfice / commandes livrées',money(m.profit/Math.max(1,m.delivered.length))],['Marge nette','Bénéfice / CA livré',pct(m.profit,m.sales)],['ROI opérationnel','Bénéfice / (coûts produits + charges + publicité + agents)',pct(m.profit,m.goods+m.charges+m.adSpend+m.agents)]].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`))}</section>`;else {let key={products:'product',wilayas:'wilaya',carriers:'carrier',agents:'agent',channels:'channel'}[t]||'wilaya';body=`<section class="card"><div class="card-head"><h2>Analyse par ${t==='products'?'produit':t==='wilayas'?'wilaya':t==='carriers'?'transporteur':t==='agents'?'agent':'canal'}</h2><span class="pill">Toute la démo</span></div>${table(['Segment','Commandes','Confirmées','Livrées','Retournées','Taux confirmation','Taux livraison','CA livré'],groupStats(key).map(g=>`<tr><td><b>${esc(g.name)}</b></td><td>${g.total}</td><td>${g.confirmed}</td><td>${g.delivered}</td><td>${g.returned}</td><td>${pct(g.confirmed,g.total)}</td><td>${pct(g.delivered,g.confirmed)}</td><td>${money(g.sales)}</td></tr>`))}</section>`}return header('Les chiffres qui font la différence.','Analysez la rentabilité et identifiez où améliorer votre performance COD.',btn('Exporter le rapport','exportReport','download'))+tabs([['overview','KPI & rentabilité'],['products','Produits'],['wilayas','Wilayas'],['carriers','Transporteurs'],['agents','Agents'],['channels','Canaux']],t)+body}
function adsPage(){const t=tab||'campaigns',m=metrics(activeOrders());let body='';if(t==='campaigns')body=`<div class="kpis">${kpi('Dépenses publicitaires',f(m.adSpend),'wallet','orange','Budgets de démonstration saisis','ads','DA',1)}${kpi('CPA brut',f(m.adSpend/Math.max(1,m.os.length)),'target','blue','Dépenses / toutes les commandes','ads','DA',2)}${kpi('CPA livré',f(m.adSpend/Math.max(1,m.delivered.length)),'truck','purple','Dépenses / commandes livrées','ads','DA',4)}${kpi('ROAS livré',(m.sales/Math.max(1,m.adSpend)).toFixed(2)+'×','chart','green','Basé sur le CA effectivement livré','ads','',3)}</div><div class="notice">${icon('info')}Données publicitaires de démonstration. Les interrupteurs modifient la maquette et n’agissent sur aucune campagne réelle.</div><section class="card">${table(['Campagne','Plateforme','Dépense','Commandes','Livrées','CPA livré','ROAS livré','Active','Action'],db.campaigns.map(c=>{let os=activeOrders().filter(o=>o.campaign===c.id),ds=os.filter(o=>o.status==='delivered');return `<tr><td><b>${esc(c.name)}</b><small class="muted" style="display:block">UTM campaign : ${c.id}</small></td><td>${esc(c.platform)}</td><td>${money(c.spend)}</td><td>${os.length}</td><td>${ds.length}</td><td>${ds.length?money(c.spend/ds.length):'—'}</td><td>${c.spend?(sum(ds,total)/c.spend).toFixed(2)+'×':'—'}</td><td><button class="switch ${c.status?'on':''}" data-campaign-toggle="${c.id}" role="switch" aria-checked="${c.status}" aria-label="État de la campagne démo"></button></td><td><button class="btn sm" data-edit-campaign="${c.id}">Modifier</button></td></tr>`}))}</section>`;else if(t==='tracking')body=`<div class="notice">${icon('info')}Aucun événement n’est transmis à Meta ou TikTok. Les aperçus ci-dessous servent à valider le parcours avant une connexion serveur.</div><div class="grid2"><section class="card pad"><h2>Des signaux COD à chaque étape</h2><p style="font-size:0.875rem;margin-top:6px">Reliez l’acquisition au résultat réel de la commande.</p>${[['Commande reçue','Purchase','purple'],['Commande confirmée','OrderConfirmed','blue'],['Commande livrée','OrderDelivered','green']].map(([l,event,c])=>`<div class="setting-line"><span><b>${l}</b><p>${event}</p></span>${badge('Aperçu',c)}</div>`).join('')}<button class="btn primary mt" data-action="testTracking">${icon('play')}Prévisualiser un événement</button></section><section class="card pad"><h2>Attribution & déduplication</h2><dl class="detail-grid mt"><div><dt>Identifiant de commande</dt><dd>order_id</dd></div><div><dt>Campagne</dt><dd>utm_campaign</dd></div><div><dt>Identifiant d’événement</dt><dd>commande + type + version</dd></div><div><dt>Devise de vente</dt><dd>DZD</dd></div></dl><div class="notice mt">${icon('info')}Le signal d’achat, le consentement, le hachage des données et la déduplication seront à valider lors de l’intégration réelle.</div>${btn('Ouvrir Suite COD & tracking','goSuite','bolt')}</section></div><section class="card mt"><div class="card-head"><h2>Aperçu des correspondances</h2><span class="pill">Exemples locaux</span></div>${table(['Commande','Source','Campagne','Statut COD','Événement proposé'],activeOrders().slice(0,12).map(o=>`<tr><td>${o.id}</td><td>${esc(o.source)}</td><td>${esc(db.campaigns.find(c=>c.id===o.campaign)?.name||'Direct')}</td><td>${statusBadge(o.status)}</td><td>${o.status==='delivered'?'OrderDelivered':CONF.includes(o.status)?'OrderConfirmed':'Purchase'}</td></tr>`))}</section>`;else body=`<div class="grid2"><section class="card pad"><h2>Simulateur de rentabilité COD</h2><p class="mb mt" style="font-size:0.875rem">Modifiez les hypothèses. Le résultat se recalcule immédiatement.</p><form id="simulator"><div class="form-grid">${field('Commandes générées','orders',100,'number',true,'min="1"')}${field('Prix produit vendu (DA)','price',5500,'number',true,'min="0"')}${field('Coût produit (DA)','cost',2750,'number',true,'min="0"')}${field('CPA brut ($)','cpa',2,'number',true,'min="0" step="0.1"')}${field('Confirmation (%)','confirmation',75,'number',true,'min="0" max="100"')}${field('Livraison / confirmées (%)','delivery',80,'number',true,'min="0" max="100"')}${field('Coût livraison (DA)','shipping',450,'number',true,'min="0"')}${field('Coût d’un retour (DA)','returnFee',150,'number',true,'min="0"')}${field('1 USD = DA','exchange',db.settings.exchange,'number',true,'min="1"')}${field('Autres charges (DA)','fixed',0,'number',true,'min="0"')}</div></form></section><section class="card pad"><h2>Votre scénario</h2><div id="simulation-output" class="mt">${simulationHTML({orders:100,price:5500,cost:2750,cpa:2,confirmation:75,delivery:80,shipping:450,returnFee:150,exchange:db.settings.exchange,fixed:0})}</div><p class="mt" style="font-size:0.875rem">Hypothèses simplifiées : hors frais de livraison facturés au client, fiscalité et coûts non saisis. Les retours sont calculés sur les commandes confirmées non livrées.</p></section></div>`;return header('Vos publicités, reliées à vos livraisons.','Du clic au cash : suivez les commandes qui créent vraiment de la valeur.',t==='campaigns'?btn('Ajouter une campagne','newCampaign','plus','primary'):btn('Intégrations','goIntegrations','link'))+tabs([['campaigns','Campagnes & rentabilité'],['tracking','Tracking COD'],['simulator','Simulateur de profit']],t)+body}
function simulationHTML(v){let conf=v.orders*v.confirmation/100,del=conf*v.delivery/100,ret=conf-del,spend=v.orders*v.cpa*v.exchange,rev=del*v.price,profit=rev-del*(v.cost+v.shipping)-ret*v.returnFee-spend-v.fixed,be=(del*(v.price-v.cost-v.shipping)-ret*v.returnFee-v.fixed)/Math.max(1,v.orders)/Math.max(1,v.exchange);return `<div class="stat-box"><p>Bénéfice prévisionnel</p><strong class="${profit>=0?'positive':'negative'}" style="font-size:2.125rem">${money(profit)}</strong></div><div class="grid2 mt"><div class="stat-box"><p>Livraisons prévues</p><strong>${f(del)}</strong></div><div class="stat-box"><p>CPA brut maximal</p><strong>${be.toFixed(2)} $</strong></div></div>${[['Commandes confirmées',f(conf)],['Retours prévus',f(ret)],['Ventes réalisées',money(rev)],['Dépense publicitaire',money(spend)],['Marge nette',pct(profit,rev)]].map(([l,n])=>`<div class="total-line"><span class="muted">${l}</span><b>${n}</b></div>`).join('')}`}

===chatName).map(m=>`<div class="message ${m.out?'out':''}">${esc(m.text)}<small>${m.time} · ${m.out?'Simulation locale':'Exemple client'}</small></div>`).join('')}</div><form class="chat-compose" data-form="message"><input class="input" name="text" placeholder="Écrire une réponse de démonstration…" required maxlength="2000" aria-label="Votre réponse"><button type="submit" class="btn primary">${icon('arrow')}<span>Simuler</span></button></form></div></section>`}return header('La conversation au cœur de la vente.','Boîte de réception, modèles et campagnes WhatsApp / SMS.',t==='templates'?btn('Nouveau modèle','newTemplate','plus','primary'):t==='campaigns'?btn('Nouveau brouillon','newMessageCampaign','plus','primary'):btn('Configurer un canal','configWhatsApp','link'))+tabs([['inbox','Boîte de réception'],['templates','Modèles',db.templates.length],['campaigns','Campagnes']],t)+body}

function parseCSV(text){text=text.replace(/^\uFEFF/,'');const delim=text.split('\n')[0].includes(';')?';':',';let rows=[],row=[],val='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){val+='"';i++}else quoted=!quoted}else if(c===delim&&!quoted){row.push(val);val=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(val);if(row.some(v=>v.trim()))rows.push(row);row=[];val=''}else val+=c}if(val||row.length){row.push(val);rows.push(row)}return rows}

ignore OrderDelivered lorsque sa date dépasse sa fenêtre de sept jours, avec une marge d’une heure. La livraison reste visible dans le CRM.</p></div></li><li><div><b>Autres transporteurs</b><p>Maystro, Procolis et Guepex nécessitent leurs pilotes. Leur présence dans un sélecteur du CRM ne signifie pas qu’une connexion est active.</p></div></li></ul></section></div>`}
function suiteRows(d){return d.orders.flatMap(o=>o.events.map(e=>({o,e}))).filter(({o,e})=>(suiteFilters.event==='all'||e.name===suiteFilters.event)&&(suiteFilters.state==='all'||e.state===suiteFilters.state)&&(!suiteFilters.q||[o.number,o.id,o.delivery.tracking,e.event_id].join(' ').toLowerCase().includes(suiteFilters.q.toLowerCase())))}
function suiteJournal(d){const all=suiteRows(d),pages=Math.max(1,Math.ceil(all.length/20));suiteFilters.page=Math.min(suiteFilters.page,pages);const rows=all.slice((suiteFilters.page-1)*20,suiteFilters.page*20);return `<section class="card"><div class="card-head"><div><h2>Journal des signaux COD</h2><p>Un état par commande et par événement · ${f(all.length)} résultat(s)</p></div>${btn('Exporter ce journal','suiteExportJournal','download')}</div><form class="toolbar suite-fields" data-suite-form="filters">${field('Commande, tracking ou event_id','q',suiteFilters.q,'search')}${selectField('Événement','event',[['all','Tous les événements'],...SUITE_EVENTS],suiteFilters.event)}${selectField('État','state',[['all','Tous les états'],...Object.entries(SUITE_STATES).map(([id,v])=>[id,v[0]])],suiteFilters.state)}<button class="btn" type="submit">Filtrer</button></form>${table(['Commande','Événement','État du signal','Valeur estimée¹','Livraison','Détail'],rows.map(({o,e})=>{const currency=o.currency==='DZD'?'EUR':o.currency,value=o.currency==='DZD'?o.merchandise_total/d.config.rate_dzd_eur:o.merchandise_total;return `<tr><td><b>#${esc(o.number)}</b><small class="muted" style="display:block">${esc(o.status)}</small></td><td>${e.name}</td><td>${suiteEventBadge(e.state)}</td><td>${suiteAmount(value,currency)}</td><td>${suiteDeliveryBadge(o.delivery)}</td><td><button class="btn sm" data-suite-order="${esc(o.id)}" data-suite-event="${e.name}" aria-label="Détail ${e.name}, commande ${esc(o.number)}">Inspecter</button></td></tr>`}))}<div class="suite-pagination"><span>Page ${suiteFilters.page} / ${pages}</span><div class="flex"><button class="btn" data-suite-page="-1" ${suiteFilters.page<=1?'disabled':''}>Précédent</button><button class="btn" data-suite-page="1" ${suiteFilters.page>=pages?'disabled':''}>Suivant</button></div></div></section><p class="suite-small muted mt">¹ Recalcul avec le montant et le taux actuels de l’instantané. Le payload historique n’est pas conservé dans l’export. L’absence de marqueur ne prouve pas un échec. Les dates de marqueurs sont exprimées dans le fuseau WordPress : ${esc(d.store.timezone)}.</p>`}
function suiteEco(d){const e=d.config.ecotrack,os=d.orders,err=os.filter(o=>o.delivery.has_error),rows=os.filter(o=>o.delivery.tracking||o.delivery.status!=='unknown'||o.delivery.has_error);return `<div class="grid3 mb">${[['Colis suivis',rows.length,'truck','blue'],['Erreurs renseignées',err.length,'info','orange'],['Retours signalés',os.filter(o=>o.delivery.status==='returned').length,'return','purple']].map(([label,n,ic,c])=>`<section class="card pad between"><div><p class="suite-small">${label}</p><strong class="metric">${n}</strong></div><span class="task-icon" style="${tone(c)}">${icon(ic)}</span></section>`).join('')}</div><div class="grid2 mb"><section class="card pad"><h2>EcoTrack · création & suivi</h2>${[['Configuration du jeton',e.configured?'Présent côté WordPress':'Non renseignée'],['Création après confirmation',e.auto_create?'Activée dans la configuration':'Désactivée'],['Validation du colis',e.auto_ship?'Automatique dans la configuration':'Manuelle'],['Fréquence de relevé prévue',e.poll_interval_minutes+' minutes'],['Dernier relevé Suite',e.last_poll.at||'Non renseigné']].map(([a,b])=>`<div class="setting-line"><span>${a}</span><b>${esc(b)}</b></div>`).join('')}<p class="suite-small muted mt">Ces indicateurs décrivent la configuration exportée. Le fichier HTML ne lance ni poll, ni création, ni réessai chez EcoTrack.</p></section><section class="card pad"><h2>Traiter les exceptions</h2><ul class="suite-health"><li><div><b>Échec d’un transfert</b><p>Ouvrez la commande dans WooCommerce pour consulter l’erreur détaillée et relancer depuis la boîte EcoTrack.</p></div></li><li><div><b>Réessais automatiques Suite</b><p>Délais prévus : 2, 5, 15, 30 puis 60 minutes. Leur exécution dépend du planificateur WordPress.</p></div></li><li><div><b>Colis sans commande associée</b><p>${e.last_poll.unmatched} au dernier relevé. Vérifiez la référence de commande et le tracking dans WooCommerce.</p></div></li></ul>${suiteGo('Actualiser par un import','bridge','upload')}</section></div><section class="card"><div class="card-head"><div><h2>Colis du périmètre</h2><p>Les 50 premières lignes. Utilisez le journal pour rechercher une référence.</p></div>${suiteGo('Rechercher une commande','events','search')}</div>${table(['Commande','Transporteur','Tracking','Situation','Attention','Action'],rows.slice(0,50).map(o=>`<tr><td>#${esc(o.number)}</td><td>${esc(o.delivery.source)}</td><td>${esc(o.delivery.tracking||'Non renseigné')}</td><td>${suiteDeliveryBadge(o.delivery)}</td><td>${o.delivery.has_error?badge('Erreur Suite','red'):o.delivery.linked?badge('Colis existant lié','blue'):'—'}</td><td><button class="btn sm" data-suite-order="${esc(o.id)}" data-suite-event="OrderDelivered">Inspecter</button></td></tr>`))}</section>`}
function suitePixels(d){const real=suiteIsReal(d),imported=suiteEnsure().mode==='import',rate=d.config.rate_dzd_eur;return `<div class="grid2"><section class="card pad"><div class="between mb"><h2>Pixels Meta</h2>${badge(d.config.pixels.length+' configuré(s)','blue')}</div>${d.config.pixels.map((p,i)=>`<div class="suite-pixel"><span class="task-icon" style="${tone('blue')}">${icon('target')}</span><div class="grow"><b>${esc(p.label)}</b><br><code>${esc(p.pixel_id||'ID manquant')}</code><p class="suite-small">${real?(p.token_present?'Jeton présent dans WordPress':'Jeton absent de la configuration'):'Configuration de démonstration · aucun jeton'}</p></div>${badge(p.active?'Actif dans la configuration':'Désactivé',p.active?'green':'gray')}${!imported?`<button class="icon-btn" data-suite-remove-pixel="${i}" aria-label="Retirer le pixel ${esc(p.label)}">${icon('trash')}</button>`:''}</div>`).join('')||'<p>Aucun pixel renseigné.</p>'}${!imported?`<form class="mt" data-suite-form="pixel"><div class="form-grid">${field('Libellé du pixel','label','','text',true,'maxlength="100"')}${field('Identifiant public','pixel_id','','text',true,'inputmode="numeric" pattern="[0-9]{5,30}" maxlength="30"')}</div><button class="btn mt" type="submit">${icon('plus')}Ajouter à la démo</button></form>`:'<p class="suite-small muted mt">Modifiez les pixels dans WordPress, puis réimportez un nouvel instantané.</p>'}</section><section class="card pad"><h2>Valeur envoyée à Meta</h2><div class="notice mt">${icon('info')}La Suite 6.1.9 convertit DZD → EUR. Le taux USD du simulateur de publicité reste indépendant.</div><form data-suite-form="rate"><div class="form-grid">${field('1 EUR = montant en DZD','rate',rate,'number',true,`min="0.01" max="100000" step="0.01" ${imported?'readonly':''}`)}<label class="field"><span>Devise de destination DZD</span><input value="EUR · comportement de la Suite" readonly></label></div>${!imported?'<button class="btn mt" type="submit">Enregistrer le taux démo</button>':''}</form><div class="mt"><label class="field"><span>Tester un montant hors livraison (DZD)</span><input type="number" min="0" step="0.01" value="5500" id="suite-convert-amount"></label><div class="total-line grand"><span>Équivalent estimé</span><output id="suite-convert-result" aria-live="polite">${suiteAmount(5500/rate,'EUR')}</output></div></div><p class="suite-small muted mt">Taux saisi par la boutique, sans cotation en temps réel. Les montants non DZD gardent leur devise dans la Suite.</p></section><section class="card pad"><h2>Qualité des signaux</h2><p class="mt">La passerelle exporte uniquement la présence des métadonnées. Elle ne mesure ni le score EMQ ni la réception de chaque pixel.</p><div class="mt">${['fbp','fbc','external_id','ip','ua'].map(k=>`<div class="total-line"><code>${k}</code><span>${suiteIsReal(d)?d.orders.filter(o=>o.signals[k]).length+' / '+d.orders.length+' commandes':'Non collecté dans la démo'}</span></div>`).join('')}</div></section><section class="card pad"><h2>Configuration observée</h2><div class="setting-line"><span>Version Graph API configurée</span><b>${esc(d.config.meta_api_version)}</b></div><div class="setting-line"><span>Code de test présent</span>${badge(d.config.test_mode?'Oui':'Non',d.config.test_mode?'orange':'gray')}</div><p class="suite-small muted mt">La disponibilité de la version API et l’acceptation des événements se vérifient côté WordPress et Meta Events Manager. Aucun test réseau n’est exécuté ici.</p></section></div>`}
function suiteBridge(d){return `<div class="grid2"><section class="card pad"><h2>Relier votre Suite au CRM</h2><ol class="suite-steps mt"><li><div><b>Installer la passerelle</b><p>Dans WordPress → Extensions, installez le ZIP « weconvert-crm-bridge-1.0.0.zip » fourni avec le CRM. Conservez WeConvert Suite 6.1.9 active.</p></div></li><li><div><b>Exporter l’activité</b><p>Ouvrez WooCommerce → WeConvert CRM. Choisissez la période et téléchargez l’instantané JSON.</p></div></li><li><div><b>Importer et vérifier</b><p>Validez l’aperçu ci-dessous. Les nouvelles données remplacent uniquement le précédent instantané Suite.</p></div></li><li><div><b>Actualiser au besoin</b><p>Réexportez après un changement de statut ou un relevé transporteur. Chaque import porte sa date et son périmètre.</p></div></li></ol>${btn('Importer l’instantané JSON','suiteImport','upload','primary')}</section><section class="card pad"><h2>Votre connexion actuelle</h2><dl class="detail-grid mt"><div><dt>Source affichée</dt><dd>${suiteIsReal(d)?'Export WordPress':'Démonstration locale'}</dd></div><div><dt>Mode d’échange</dt><dd>Import manuel · lecture seule</dd></div><div><dt>Périmètre</dt><dd>${d.orders.length} commandes · date de création</dd></div><div><dt>Passerelle</dt><dd>Version ${esc(d.bridge_version)}</dd></div></dl><div class="notice mt">${icon('info')}Les commandes importées sont consultables dans ce module. Les modifications des commandes, du stock et des finances de la démo restent locales. Aucun changement n’est renvoyé à WooCommerce.</div><div class="suite-inline">${btn('Télécharger un exemple JSON','suiteSample','download')}${suiteEnsure().snapshot?btn('Afficher le dernier import','suiteUseImport','file'):''}</div></section><section class="card pad"><h2>Données transférées</h2><p class="mt">Références et montants des commandes, statuts WooCommerce, tracking des colis, marqueurs Meta, présence des signaux et configuration publique des pixels.</p><p class="mt">La passerelle écarte les jetons API, les noms et coordonnées clients, les IP, les cookies et leurs valeurs. L’import est validé avant enregistrement.</p></section><section class="card pad"><h2>Ce qui reste côté serveur</h2><p class="mt">La Suite continue de gérer CAPI, le pixel, la capture des signaux, les transferts EcoTrack et ses réessais. La passerelle ajoute des observations de livraison indépendantes du succès Meta.</p><p class="mt">Une synchronisation bidirectionnelle nécessitera une application CRM avec authentification, base de données et API. Le fichier HTML constitue l’interface de travail et de validation.</p></section></div>`}

function suiteInspect(id,name){const d=suiteData(),o=d.orders.find(o=>o.id===id),e=o?.events.find(e=>e.name===name);if(!o||!e)return;const currency=o.currency==='DZD'?'EUR':o.currency,value=+(o.currency==='DZD'?o.merchandise_total/d.config.rate_dzd_eur:o.merchandise_total).toFixed(2),evidence={carrier_observed:'Signal transporteur enregistré par la passerelle',suite_delivery_flag:'Marqueur historique OrderDelivered ; observation transporteur indépendante indisponible',suite_return_flag:'Marqueur de retour EcoTrack',suite_shipped_flag:'Marqueur d’expédition Suite',none:'Aucune observation disponible',demo:'État simulé de la commande CRM'}[o.delivery.evidence];modal(esc(name)+' · #'+esc(o.number),`<div class="between wrap mb">${suiteEventBadge(e.state)}${suiteDeliveryBadge(o.delivery)}</div><div class="notice">${icon('info')}${suiteIsReal(d)?'Lecture de l’instantané. Aucun renvoi ni changement de statut depuis cette fenêtre.':'Aperçu de simulation. Aucun appel API effectué.'}</div><dl class="detail-grid"><div><dt>Statut WooCommerce</dt><dd>${esc(o.status)}</dd></div><div><dt>Montant de la commande</dt><dd>${suiteAmount(o.total,o.currency)}</dd></div><div><dt>Valeur hors livraison</dt><dd>${suiteAmount(o.merchandise_total,o.currency)}</dd></div><div><dt>Valeur estimée au taux actuel</dt><dd>${suiteAmount(value,currency)}</dd></div><div><dt>Date du marqueur Suite</dt><dd>${esc(e.recorded_at||'Non renseignée')} ${e.recorded_at?'('+esc(d.store.timezone)+')':''}</dd></div><div><dt>Tracking transporteur</dt><dd>${esc(o.delivery.tracking||'Non renseigné')}</dd></div><div><dt>Source de l’état livraison</dt><dd>${esc(evidence)}</dd></div><div><dt>Observation transporteur</dt><dd>${suiteDate(o.delivery.observed_at)}</dd></div></dl><h3 class="form-section">Identifiants observés</h3><dl class="detail-grid"><div><dt>event_id enregistré</dt><dd class="suite-detail-value">${esc(e.event_id||'Non renseigné')}</dd></div><div><dt>Identifiant navigateur Purchase</dt><dd class="suite-detail-value">${esc(e.browser_event_id||'Non renseigné / non applicable')}</dd></div></dl><p class="suite-small muted mt">La Suite peut suffixer l’identifiant selon le pixel. La présence de ces valeurs ne suffit pas à confirmer la déduplication chez Meta.</p><h3 class="form-section">Aperçu du signal, recalculé</h3><pre class="suite-code">${esc(JSON.stringify({preview_only:true,event_name:e.name,order_id:o.id,event_id:e.event_id||null,value,currency,shipping_excluded:true,source:suiteIsReal(d)?'wordpress_snapshot':'demo'},null,2))}</pre><p class="suite-small muted mt">Cet aperçu ne contient pas de user_data et n’est pas un payload prêt à envoyer. Aucun score EMQ ni accusé Meta n’est disponible dans cet export.</p>`,btn('Fermer','close'),'wide')}
function suiteImportModal(){suiteCandidate=null;modal('Importer un instantané WeConvert Suite',`<p class="mb">Choisissez l’export de WooCommerce → WeConvert CRM, ou collez son contenu JSON. Taille maximale : 4 Mo.</p><div class="suite-import"><label class="field"><span>Fichier JSON de la passerelle</span><input type="file" id="suite-import-file" accept=".json,application/json"></label></div><details class="suite-paste mt"><summary>Coller le JSON manuellement</summary><label class="field mt"><span>Contenu de l’export</span><textarea id="suite-import-json" rows="6" placeholder='{"schema":"weconvert-suite-crm/v1",…}'></textarea></label><button class="btn mt" data-action="suiteValidatePaste">Valider le JSON</button></details><div id="suite-import-preview" class="mt" aria-live="polite"></div><p class="suite-small muted mt">Seul l’instantané Suite sera remplacé. Votre démo CRM et ses commandes sont conservées.</p>`,btn('Annuler','close')+'<button class="btn primary" id="suite-import-confirm" data-action="suiteConfirmImport" disabled>Importer cet instantané</button>','wide')}
function suitePrepareImport(text){suiteCandidate=null;$('#suite-import-confirm').disabled=true;try{if(new Blob([text]).size>4*1024*1024)throw Error('Fichier trop volumineux : 4 Mo maximum.');const d=suiteValidate(JSON.parse(text));suiteCandidate=d;$('#suite-import-preview').innerHTML=`<div class="notice">${icon('checkcircle')}Export valide : ${f(d.orders.length)} commandes · ${esc(d.store.name)} · ${suiteIsReal(d)?'données WordPress':'données de démonstration'}.</div><p class="suite-small">Créé le ${suiteDate(d.generated_at)}. ${d.scope.truncated?'Export partiel : '+f(d.scope.total_matching)+' commandes correspondent à la période.':'Le périmètre exporté est complet.'}</p>`;$('#suite-import-confirm').disabled=false}catch(e){$('#suite-import-preview').textContent='Import refusé : '+e.message}}
function suiteTrackingCard(o){const model=suiteDemoOrder(o);return `<section class="card pad mt"><div class="between wrap"><h3>Signaux Suite · simulation</h3>${btn('Ouvrir la Suite','goSuite','chart')}</div><p class="suite-small muted mt">La création, la confirmation et la livraison correspondent à trois événements distincts.</p>${model.events.map(e=>`<div class="total-line"><code>${e.name}</code>${suiteEventBadge(e.state)}</div>`).join('')}</section>`}

Object.assign(ACTIONS,{
 goSuite:()=>navigate('suite'),suiteImport:suiteImportModal,
 suiteDemo:()=>{suiteEnsure().mode='demo';suiteFilters.page=1;save();render();toast('Simulation locale affichée. Le dernier import reste conservé.');},
 suiteUseImport:()=>{if(!suiteEnsure().snapshot)return;suiteEnsure().mode='import';save();navigate('suite');},
 suiteSample:()=>download('weconvert-suite-exemple.json',JSON.stringify(suiteDemoSnapshot(),null,2),'application/json'),
 suiteValidatePaste:()=>suitePrepareImport($('#suite-import-json').value),
 suiteConfirmImport:()=>{if(!suiteCandidate)return;const s=suiteEnsure();const next={...s,snapshot:suiteCandidate,mode:'import'};try{localStorage.setItem(KEY,JSON.stringify({...db,suite:next}));db.suite=next;suiteCandidate=null;suiteFilters={event:'all',state:'all',q:'',page:1};closeModal();navigate('suite');toast('Instantané importé. Les données WooCommerce sont en lecture seule.');}catch{toast('Stockage insuffisant : l’instantané n’a pas été remplacé.','info');}},
 suiteExportJournal:()=>{const d=suiteData(),rows=suiteRows(d),csv=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';download('weconvert-journal-signaux.csv','\uFEFF'+[['source','commande','evenement','etat','date_marqueur','fuseau','event_id','livraison','tracking'],...rows.map(({o,e})=>[d.source_mode,o.number,e.name,SUITE_STATES[e.state][0],e.recorded_at,d.store.timezone,e.event_id,o.delivery.status,o.delivery.tracking])].map(r=>r.map(csv).join(';')).join('\r\n'),'text/csv;charset=utf-8');toast('Journal filtré exporté.');},
 testTracking:()=>{const d=suiteData(),o=d.orders.find(o=>o.events.find(e=>e.name==='OrderDelivered')?.state!=='not_recorded')||d.orders[0];if(!o){toast('Aucune commande dans le périmètre.','info');return}suiteInspect(o.id,o.events.find(e=>e.name==='OrderDelivered')?.state!=='not_recorded'?'OrderDelivered':'Purchase');}
});
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;const d=el.dataset;if(d.suiteNav){navigate('suite',d.suiteNav);return}if(d.suiteOrder){suiteInspect(d.suiteOrder,d.suiteEvent||'Purchase');return}if(d.suiteFilterEvent){suiteFilters={event:d.suiteFilterEvent,state:'all',q:'',page:1};navigate('suite','events');return}if(d.suitePage){suiteFilters.page=Math.max(1,suiteFilters.page+Number(d.suitePage));render();return}if(d.suiteRemovePixel!==undefined&&suiteEnsure().mode==='demo'){suiteEnsure().pixels.splice(+d.suiteRemovePixel,1);save();render();toast('Pixel retiré de la configuration de démonstration.')}});
document.addEventListener('submit',e=>{const form=e.target.closest('form[data-suite-form]');if(!form)return;e.preventDefault();e.stopImmediatePropagation();if(!form.checkValidity()){form.reportValidity();return}const v=Object.fromEntries(new FormData(form)),kind=form.dataset.suiteForm;if(kind==='filters'){suiteFilters={q:String(v.q).trim(),event:v.event,state:v.state,page:1};render();return}if(suiteEnsure().mode!=='demo')return;if(kind==='rate'){if(!Number.isFinite(+v.rate)||+v.rate<=0||+v.rate>100000)return;suiteEnsure().rate=+v.rate;}if(kind==='pixel'){if(suiteEnsure().pixels.length>=50){toast('Maximum de 50 pixels.','info');return}if(suiteEnsure().pixels.some(p=>p.pixel_id===v.pixel_id)){toast('Ce pixel existe déjà dans la démo.','info');return}suiteEnsure().pixels.push({label:v.label.trim(),pixel_id:v.pixel_id,active:true,token_present:false});}save();render();toast('Configuration de démonstration enregistrée.');},true);
document.addEventListener('change',async e=>{if(e.target.id!=='suite-import-file')return;const file=e.target.files[0];if(!file)return;if(file.size>4*1024*1024){suiteCandidate=null;$('#suite-import-confirm').disabled=true;$('#suite-import-preview').textContent='Import refusé : 4 Mo maximum.';return}try{suitePrepareImport(await file.text());}catch{suiteCandidate=null;$('#suite-import-confirm').disabled=true;$('#suite-import-preview').textContent='Le fichier n’a pas pu être lu.';}});
document.addEventListener('input',e=>{if(e.target.id==='suite-convert-amount'){const n=+e.target.value;$('#suite-convert-result').textContent=e.target.value!==''&&Number.isFinite(n)&&n>=0?suiteAmount(n/suiteData().config.rate_dzd_eur,'EUR'):'Saisissez un montant positif';}if(e.target.id==='suite-import-json'&&suiteCandidate){suiteCandidate=null;$('#suite-import-confirm').disabled=true;$('#suite-import-preview').textContent='Le contenu a changé. Validez à nouveau le JSON.';}});
const suiteOriginalBackupValidator=validateBackup;
validateBackup=function(b){const result=suiteOriginalBackupValidator(b);if(result.suite){const s=result.suite;if(s.snapshot)s.snapshot=suiteValidate(s.snapshot);if(!Number.isFinite(s.rate)||s.rate<=0||s.rate>100000||!Array.isArray(s.pixels)||s.pixels.length>50||s.pixels.some(p=>typeof p.label!=='string'||typeof p.pixel_id!=='string'||!/^\d{1,30}$/.test(p.pixel_id)||typeof p.active!=='boolean'||typeof p.token_present!=='boolean'))throw Error('Configuration Suite invalide.');s.mode=s.mode==='import'&&s.snapshot?'import':'demo';}return result;};
suiteEnsure();

render();
</script></body></html>
